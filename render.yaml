# Render.com Blueprint Infrastructure as Code (v1.0)
# Automatically provisions a PostgreSQL Database and Docker Web Service on Render.com

services:
  - type: web
    name: certiport-platform
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: certiport-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXTAUTH_URL
        sync: false

databases:
  - name: certiport-db
    plan: free
    databaseName: certiport
    user: certiport_user
    region: singapore
